name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Install Arduino CLI
      uses: arduino/compile-sketches@v1
    - name: Compile sketch for Arduino UNO
      uses: arduino/compile-sketches@v1
      with:
       fqbn: arduino:avr:uno
       sketch-paths: |
        ./src
